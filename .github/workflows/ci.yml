name: CI - Lint and Build

on:
  push:
    branches: [ master, main ]  # Only run on direct pushes to main/master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ master, main ]  # Run on PRs targeting main/master
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: "Internet Archive"
  PROJECT: "Internet Archive.xcodeproj"

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --config .swiftlint.yml --reporter github-actions-logging

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to macos-26 (GA) so builds stay deterministic while the
          # macos-latest label migrates from macOS 15 to macOS 26 (June 2026).
          # macos-26 ships Xcode 26.0-26.5; 26.4 is the image default.
          - os: macos-26
            xcode: "26.4"
            destination: "platform=tvOS Simulator,name=Apple TV 4K (3rd generation)"

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
          xcodebuild -version
          swift --version

      - name: Cache SPM packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            .swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Show available simulators
        run: xcrun simctl list devices available | grep -i "tv"

      - name: Build for tvOS
        id: build
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME }}" \
            -destination "${{ matrix.destination }}" \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | xcpretty --color

  # Summary job that checks overall CI health
  ci-success:
    name: CI Success
    needs: [swiftlint, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "=== CI Summary ==="
          echo "SwiftLint: ${{ needs.swiftlint.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo ""

          if [ "${{ needs.swiftlint.result }}" == "success" ] && [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ All CI checks passed!"
            exit 0
          else
            echo "❌ CI checks failed"
            exit 1
          fi
